<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>dropX — Web Share Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /* ─── Light Mode Token Palette Matrix ────────────────────────── */
        :root {
            --bg: #f8f9fa;
            --surface: #ffffff;
            --surface-hover: #f1f3f4;
            --border: #e0e0e0;
            --border-strong: #c6c6c6;
            --t1: #1c1c1e;
            --t2: #5f6368;
            --t3: #9aa0a6;
            --accent: #1c1c1e;
            --accent-surf: #f1f3f4;

            --success: #188038;
            --success-surf: #e6f4ea;
            --red: #d93025;
            --pink: #e91e63;
            --purple: #9c27b0;
            --orange: #ff9800;
            --green: #4caf50;
            --slate: #607d8b;

            --r: 8px;
            --r-lg: 12px;
            --r-full: 9999px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,.05);
            --shadow-lg: 0 12px 36px rgba(0,0,0,.12);
            --transition: 160ms cubic-bezier(.4, 0, .2, 1);

            --topbar-h: 64px;
            --sidebar-w: 220px;
        }

        /* ─── Dynamic System Dark Mode Override ────────────────────── */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --surface: #1c1c1e;
                --surface-hover: #2c2c2e;
                --border: #2c2c2e;
                --border-strong: #3a3a3c;
                --t1: #ffffff;
                --t2: #8e8e93;
                --t3: #48484a;
                --accent: #ffffff;
                --accent-surf: #2c2c2e;
            }
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--t1);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background var(--transition), color var(--transition);
        }

        /* ─── Scrollbar Customization ────────────────────────────── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--t2); }

        /* ─── Top Bar Framing ─────────────────────────────────────── */
        .topbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            height: var(--topbar-h);
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 16px; padding: 0 24px;
            transition: background var(--transition), border-color var(--transition);
        }
        .logo {
            display: flex; align-items: center; gap: 10px;
            width: var(--sidebar-w); flex-shrink: 0; text-decoration: none; color: inherit;
        }
        .logo-mark {
            width: 36px; height: 36px; border-radius: 10px; background: var(--accent);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            transition: background var(--transition);
        }
        .logo-mark svg { width: 18px; height: 18px; color: var(--surface); transition: color var(--transition); }
        .logo-name { font-size: 20px; font-weight: 600; letter-spacing: -.4px; color: var(--t1); }

        .search-wrap { flex: 1; max-width: 580px; }
        .search-bar {
            display: flex; align-items: center; gap: 10px;
            background: var(--bg); border: 1px solid transparent;
            border-radius: var(--r-full); height: 40px; padding: 0 16px;
            transition: background var(--transition), border-color var(--transition);
        }
        .search-bar:focus-within {
            background: var(--surface); border-color: var(--t2);
        }
        .search-bar svg { color: var(--t2); flex-shrink: 0; }
        .search-bar input {
            border: none; background: transparent; outline: none;
            font-family: inherit; font-size: 14px; color: var(--t1); width: 100%;
        }

        .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
        .icon-btn {
            width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer;
            background: transparent; display: flex; align-items: center; justify-content: center;
            color: var(--t2); transition: background var(--transition), color var(--transition); flex-shrink: 0;
        }
        .icon-btn:hover { background: var(--surface-hover); color: var(--t1); }

        .view-toggle { display: flex; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
        .vbtn {
            width: 34px; height: 34px; border: none; cursor: pointer;
            background: transparent; display: flex; align-items: center; justify-content: center;
            color: var(--t2); transition: background var(--transition), color var(--transition);
        }
        .vbtn.active { background: var(--accent-surf); color: var(--t1); }

        /* ─── Layout Compartments ────────────────────────────────── */
        .layout { display: flex; padding-top: var(--topbar-h); min-height: 100vh; }

        .sidebar {
            width: var(--sidebar-w); flex-shrink: 0;
            position: fixed; top: var(--topbar-h); bottom: 0;
            overflow-y: auto; padding: 16px 12px;
            border-right: 1px solid var(--border); background: var(--surface);
            transition: background var(--transition), border-color var(--transition);
        }
        .sb-btn {
            display: flex; align-items: center; gap: 12px;
            width: 100%; padding: 10px 14px; border: none; cursor: pointer;
            border-radius: var(--r-full); background: transparent;
            font-family: inherit; font-size: 13px; font-weight: 500;
            color: var(--t2); text-align: left; transition: background var(--transition), color var(--transition);
        }
        .sb-btn:hover { background: var(--surface-hover); color: var(--t1); }
        .sb-btn.active { background: var(--accent-surf); color: var(--t1); }
        .sb-btn.active svg { color: var(--t1); }
        .sb-btn svg { color: var(--t2); flex-shrink: 0; }
        .sb-sep { height: 1px; background: var(--border); margin: 12px 14px; }
        .sb-label {
            font-size: 11px; font-weight: 600; letter-spacing: .6px;
            text-transform: uppercase; color: var(--t2); padding: 8px 14px 6px;
        }

        .main { margin-left: var(--sidebar-w); flex: 1; padding: 32px 40px; min-width: 0; }
        .page-hdr { margin-bottom: 24px; }
        .page-title { font-size: 22px; font-weight: 600; color: var(--t1); letter-spacing: -.3px; }
        .page-sub { font-size: 13px; color: var(--t2); margin-top: 4px; }

        /* ─── Contextual Action Sheets ───────────────────────────── */
        .sel-bar {
            display: none; align-items: center; gap: 12px;
            padding: 12px 20px; background: var(--surface);
            border-radius: var(--r-lg); margin-bottom: 20px;
            border: 1px solid var(--border); box-shadow: var(--shadow-sm);
        }
        .sel-bar.on { display: flex; }
        .sel-count { font-size: 13px; font-weight: 600; color: var(--t1); }
        .sel-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }

        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 18px; border-radius: var(--r-full);
            border: none; cursor: pointer; font-family: inherit;
            font-size: 13px; font-weight: 500; transition: var(--transition);
            text-decoration: none; white-space: nowrap;
        }
        .btn-primary { background: var(--accent); color: var(--surface); }
        .btn-ghost { background: transparent; color: var(--t2); border: 1px solid var(--border); }
        .btn-ghost:hover { background: var(--surface-hover); color: var(--t1); }
        .btn-sm { padding: 6px 14px; font-size: 12px; }

        /* ─── Grid Portfolio Display ─────────────────────────────── */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--r-lg); overflow: hidden; cursor: pointer;
            transition: box-shadow var(--transition), border-color var(--transition), transform var(--transition);
            position: relative; user-select: none;
        }
        .card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
        .card.selected { border-color: var(--t1); }

        .card-thumb {
            height: 130px; background: var(--bg);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; position: relative;
        }
        .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity 200ms ease; }
        .card-thumb img.loaded { opacity: 1; }

        .card-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }

        .card-check {
            position: absolute; top: 10px; left: 10px; z-index: 10;
            width: 20px; height: 20px; border-radius: 50%;
            background: rgba(255,255,255,.9); border: 1px solid var(--border-strong);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity var(--transition);
        }
        .card:hover .card-check, .card.selected .card-check { opacity: 1; }
        .card.selected .card-check { background: var(--accent); border-color: var(--accent); color: var(--surface); }

        .card-info { padding: 12px; }
        .card-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; color: var(--t1); }
        .card-meta { font-size: 11px; color: var(--t2); }

        /* ─── List Layout Mechanics ──────────────────────────────── */
        .list-view { display: none; }
        .list-view.on { display: block; }
        .grid.on { display: grid; }
        .grid:not(.on) { display: none; }

        .list-hdr {
            display: grid; grid-template-columns: 24px 36px 1fr 110px 130px 64px; gap: 12px; align-items: center;
            padding: 10px 16px; border-bottom: 1px solid var(--border);
            font-size: 11px; font-weight: 600; color: var(--t2); letter-spacing: .4px; text-transform: uppercase;
        }
        .list-row {
            display: grid; grid-template-columns: 24px 36px 1fr 110px 130px 64px; gap: 12px; align-items: center;
            padding: 10px 16px; border-radius: var(--r); cursor: pointer;
            transition: background var(--transition); font-size: 13px;
            border: 1px solid transparent; margin: 4px 0;
        }
        .list-row:hover { background: var(--surface-hover); }
        .list-row.selected { background: var(--accent-surf); }
        .list-name { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .list-name span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; color: var(--t1); }
        .list-meta { color: var(--t2); font-size: 12px; }
        .list-chk { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--border-strong); display: flex; align-items: center; justify-content: center; }
        .list-row.selected .list-chk { background: var(--accent); border-color: var(--accent); color: var(--surface); }

        /* ─── Immersive Blur Overlay ─────────────────────────────── */
        .overlay {
            position: fixed; inset: 0; z-index: 200;
            background: rgba(0,0,0,.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            display: none; align-items: center; justify-content: center; padding: 24px;
        }
        .overlay.on { display: flex; }
        .overlay-panel {
            background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg);
            width: 100%; max-width: 840px; max-height: 88vh;
            display: flex; flex-direction: column; overflow: hidden;
            animation: panelIn 220ms cubic-bezier(.16, 1, .3, 1);
        }
        @keyframes panelIn { from { opacity: 0; transform: scale(.97) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        .ov-head { display: flex; align-items: center; gap: 16px; padding: 16px 24px; border-bottom: 1px solid var(--border); }
        .ov-title { flex: 1; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--t1); }
        .ov-head-actions { display: flex; align-items: center; gap: 6px; }

        .ov-body {
            flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center;
            background: #0c0c0d; min-height: 320px; position: relative;
        }
        .ov-body img { max-width: 100%; max-height: 60vh; object-fit: contain; display: block; }
        .ov-body video { max-width: 100%; max-height: 60vh; display: block; }
        .ov-body audio { width: min(400px, 90%); margin: 64px auto; display: block; }
        .ov-body iframe { width: 100%; height: 60vh; border: none; display: block; background: #ffffff; }

        .no-preview { display: flex; flex-direction: column; align-items: center; gap: 12px; color: #636366; padding: 64px; }
        .no-preview svg { width: 64px; height: 64px; opacity: .4; }
        .no-preview p { font-size: 13px; color: #8e8e93; }

        .ov-foot { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
        .ov-meta { font-size: 12px; color: var(--t2); margin-left: auto; text-align: right; line-height: 1.5; }

        /* ─── Structural Utilities ────────────────────────────────── */
        .spinner-wrap { padding: 120px 40px; text-align: center; color: var(--t2); }
        .spinner { width: 28px; height: 28px; border: 2.5px solid var(--border); border-top-color: var(--t1); border-radius: 50%; animation: spin 600ms linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state { padding: 120px 32px; text-align: center; color: var(--t3); }
        .empty-state svg { width: 64px; height: 64px; margin: 0 auto 16px; display: block; opacity: .4; color: var(--t2); }
        .empty-state h3 { font-size: 16px; color: var(--t1); margin-bottom: 4px; font-weight: 600; }
        .empty-state p { font-size: 13px; color: var(--t2); }

        .toast-wrap { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 8px; pointer-events: none; align-items: center; }
        .toast { background: #1c1c1e; color: #ffffff; border: 1px solid #2c2c2e; padding: 10px 20px; border-radius: var(--r-full); font-size: 13px; font-weight: 500; pointer-events: auto; box-shadow: var(--shadow-lg); animation: toastIn 180ms ease, toastOut 180ms ease 2.6s forwards; }
        @keyframes toastOut { to { opacity: 0; transform: translateY(4px); } }

        /* ─── Streaming Progress Core ────────────────────────────── */
        .dl-strip {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 250;
            background: var(--surface); border-top: 1px solid var(--border);
            display: flex; align-items: center; gap: 16px; padding: 14px 32px; font-size: 13px;
            transform: translateY(100%); transition: transform 250ms cubic-bezier(.16, 1, .3, 1);
        }
        .dl-strip.on { transform: translateY(0); }
        .dl-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--t1); font-weight: 500; }
        .dl-bar { flex: 1; height: 4px; background: var(--bg); border-radius: 2px; max-width: 320px; overflow: hidden; }
        .dl-fill { height: 100%; background: var(--t1); width: 0%; transition: width 150ms ease; }
        .dl-pct { font-size: 12px; color: var(--t2); min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }

        /* ─── Color Identifiers ──────────────────────────────────── */
        .ti { color: var(--green); } .tv { color: var(--pink); } .ta { color: var(--purple); } .tp { color: var(--red); } .tz { color: var(--orange); } .to { color: var(--slate); }

        /* ─── Responsive View Breaks ─────────────────────────────── */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main { margin-left: 0; padding: 20px 16px; }
            .logo { width: auto; }
            .logo-name { display: none; }
            .list-hdr, .list-row { grid-template-columns: 24px 28px 1fr 72px; gap: 8px; }
            .list-hdr > *:nth-child(n+5), .list-row > *:nth-child(n+5) { display: none; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(144px, 1fr)); gap: 12px; }
        }
    </style>
</head>
<body>

<header class="topbar">
    <a class="logo" href="#">
        <div class="logo-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/>
                <polyline points="16 6 12 2 8 6"/>
                <line x1="12" y1="2" x2="12" y2="15"/>
            </svg>
        </div>
        <span class="logo-name">dropX</span>
    </a>

    <div class="search-wrap">
        <div class="search-bar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" id="searchInput" placeholder="Search files…" autocomplete="off" spellcheck="false">
        </div>
    </div>

    <div class="topbar-right">
        <button class="btn btn-sm btn-primary" id="dlAllBtn" onclick="downloadSelected()" style="display:none">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download
        </button>
        <div class="view-toggle">
            <button class="vbtn active" id="gridBtn" title="Grid" onclick="setView('grid')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            </button>
            <button class="vbtn" id="listBtn" title="List" onclick="setView('list')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1" fill="currentColor"/><circle cx="3" cy="12" r="1" fill="currentColor"/><circle cx="3" cy="18" r="1" fill="currentColor"/></svg>
            </button>
        </div>
    </div>
</header>

<div class="layout">
    <aside class="sidebar">
        <button class="sb-btn active" onclick="setFilter('all',this)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            All files
        </button>
        <div class="sb-sep"></div>
        <div class="sb-label">Type</div>
        <button class="sb-btn" onclick="setFilter('image',this)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" class="ti"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            Images
        </button>
        <button class="sb-btn" onclick="setFilter('video',this)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" class="tv"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
            Videos
        </button>
        <button class="sb-btn" onclick="setFilter('audio',this)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" class="ta"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            Audio
        </button>
        <button class="sb-btn" onclick="setFilter('pdf',this)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" class="tp"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            PDFs
        </button>
        <button class="sb-btn" onclick="setFilter('other',this)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" class="to"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            Other
        </button>
    </aside>

    <main class="main">
        <div class="page-hdr">
            <h1 class="page-title" id="pageTitle">All files</h1>
            <p class="page-sub" id="pageSub">Loading…</p>
        </div>

        <div class="sel-bar" id="selBar">
            <span class="sel-count" id="selCount">0 selected</span>
            <div class="sel-actions">
                <button class="btn btn-ghost btn-sm" onclick="clearSel()">Deselect all</button>
                <button class="btn btn-primary btn-sm" onclick="downloadSelected()">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Download
                </button>
            </div>
        </div>

        <div class="grid on" id="gridView">
            <div class="spinner-wrap" style="grid-column:1/-1"><div class="spinner"></div><p>Loading staging registry…</p></div>
        </div>

        <div class="list-view" id="listView">
            <div class="list-hdr">
                <div></div><div></div>
                <div>Name</div>
                <div>Size</div>
                <div>Modified</div>
                <div></div>
            </div>
            <div id="listBody"></div>
        </div>
    </main>
</div>

<div class="overlay" id="overlay" onclick="ovClose(event)">
    <div class="overlay-panel" onclick="event.stopPropagation()">
        <div class="ov-head">
            <button class="icon-btn" onclick="ovClose()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <span class="ov-title" id="ovTitle"></span>
            <div class="ov-head-actions">
                <button class="btn btn-ghost btn-sm" id="ovPrev" onclick="ovNavigate(-1)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <button class="btn btn-ghost btn-sm" id="ovNext" onclick="ovNavigate(1)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
                <button class="btn btn-primary btn-sm" id="ovDl">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Download
                </button>
            </div>
        </div>
        <div class="ov-body" id="ovBody"></div>
        <div class="ov-foot">
            <div id="ovStreamWrap" style="display:none">
                <button class="btn btn-ghost btn-sm" id="ovStream">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/></svg>
                    Open link
                </button>
            </div>
            <div class="ov-meta" id="ovMeta"></div>
        </div>
    </div>
</div>

<div class="dl-strip" id="dlStrip">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    <span class="dl-name" id="dlName"></span>
    <div class="dl-bar"><div class="dl-fill" id="dlFill"></div></div>
    <span class="dl-pct" id="dlPct">0%</span>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
    'use strict';

    // Base URL Extractor: Safe mapping logic to parse exact base roots
    // even if loaded via sub-directory variants (e.g. /share/abcde/index.html)
    const SESSION_BASE = window.location.pathname.split('/').slice(0, 3).join('/');
    const API_FILES  = `${SESSION_BASE}/api/files`;
    const previewUrl = id => `${SESSION_BASE}/preview/${id}`;
    const fileUrl    = id => `${SESSION_BASE}/file/${id}`;

    let allFiles = [];
    let filtered = [];
    let selected = new Set();
    let currentView   = 'grid';
    let currentFilter = 'all';
    let currentQuery  = '';
    let ovIndex       = -1;

    // Fetch Milestone: Calls your custom Ktor endpoint to ingest files metadata arrays
    async function init() {
        try {
            const res = await fetch(API_FILES, { cache: 'no-store' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            allFiles = await res.json();
            applyFilter();
        } catch (e) {
            renderError();
        }
    }

    // Fallback UI State if the target node server drops offline mid-session
    function renderError() {
        document.getElementById('gridView').innerHTML = `
            <div class="empty-state" style="grid-column:1/-1">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <h3>Could not reach node server</h3>
                <p>Make sure the dropX session is still broadcasting, then reload.</p>
            </div>`;
        document.getElementById('pageSub').textContent = '';
    }

    // Filters search queries and sidebar category types synchronously across structural indexes
    function applyFilter() {
        const q = currentQuery.toLowerCase();
        filtered = allFiles.filter(f => {
            const typeOk = currentFilter === 'all' || mimeGroup(f.mimeType) === currentFilter;
            const searchOk = !q || f.name.toLowerCase().includes(q);
            return typeOk && searchOk;
        });

        const titles = { all:'All shared files', image:'Images Vault', video:'Videos Track', audio:'Audio Streams', pdf:'PDF Documents', other:'Other Assets' };
        document.getElementById('pageTitle').textContent = titles[currentFilter] || 'Files';
        document.getElementById('pageSub').textContent =
            filtered.length ? `${filtered.length} item${filtered.length !== 1 ? 's' : ''}` : 'No registry entries';

        clearSel(false);
        renderGrid();
        renderList();
    }

    function setFilter(type, btn) {
        currentFilter = type;
        document.querySelectorAll('.sb-btn').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        applyFilter();
    }

    document.getElementById('searchInput').addEventListener('input', e => {
        currentQuery = e.target.value;
        applyFilter();
    });

    // Renders Card Portfolio Grid View elements
    function renderGrid() {
        const el = document.getElementById('gridView');
        if (!filtered.length) {
            el.innerHTML = `
                <div class="empty-state" style="grid-column:1/-1">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
                    <h3>No items match criteria</h3>
                    <p>Modify search filters or download parameters.</p>
                </div>`;
            return;
        }

        el.innerHTML = filtered.map((f, i) => {
            const g = mimeGroup(f.mimeType);
            const hasImg = g === 'image' || g === 'video';
            const chk = selected.has(f.id);
            return `
            <div class="card${chk ? ' selected' : ''}" data-id="${f.id}" onclick="cardClick(event,${i})">
                <div class="card-check">${chk ? checkSvg() : ''}</div>
                <div class="card-thumb">
                    ${hasImg ? `<img src="${previewUrl(f.id)}" alt="${esc(f.name)}" loading="lazy" onload="this.classList.add('loaded')" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ''}
                    <div class="card-icon" style="${hasImg ? 'display:none' : 'display:flex'};background:${mimeColorAlpha(f.mimeType)}">
                        ${mimeIconSvg(f.mimeType, 24)}
                    </div>
                </div>
                <div class="card-info">
                    <div class="card-name" title="${esc(f.name)}">${esc(f.name)}</div>
                    <div class="card-meta">${fmtSize(f.size)}</div>
                </div>
            </div>`;
        }).join('');
    }

    // Renders List Layout Row elements
    function renderList() {
        const el = document.getElementById('listBody');
        if (!filtered.length) { el.innerHTML = ''; return; }

        el.innerHTML = filtered.map((f, i) => {
            const chk = selected.has(f.id);
            return `
            <div class="list-row${chk ? ' selected' : ''}" data-id="${f.id}" onclick="cardClick(event,${i})">
                <div class="list-chk">${chk ? checkSvg(10) : ''}</div>
                <div>${mimeIconSvg(f.mimeType, 16)}</div>
                <div class="list-name"><span title="${esc(f.name)}">${esc(f.name)}</span></div>
                <div class="list-meta">${fmtSize(f.size)}</div>
                <div class="list-meta">${fmtDate(f.lastModified)}</div>
                <div>
                    <a href="${fileUrl(f.id)}" download="${esc(f.name)}" onclick="event.stopPropagation();toast('Streaming file payload…')" class="btn btn-ghost btn-sm" style="padding:4px 10px">
                        ${dlIconSvg(12)}
                    </a>
                </div>
            </div>`;
        }).join('');
    }

    // Handles smart multi-selection clicks vs single item preview window openings
    function cardClick(e, idx) {
        const el = e.currentTarget;
        const rect = el.getBoundingClientRect();
        // Maps click boundary metrics to see if click targets are inside the upper-left select dot region
        const inCheck = (e.clientX - rect.left < 44) && (e.clientY - rect.top < 44);

        if (inCheck || selected.size > 0) {
            toggleSel(filtered[idx].id);
        } else {
            openOverlay(idx);
        }
    }

    function toggleSel(id) {
        if (selected.has(id)) selected.delete(id); else selected.add(id);
        updateSelUI(); renderGrid(); renderList();
    }

    function clearSel(rerender = true) {
        selected.clear(); updateSelUI();
        if (rerender) { renderGrid(); renderList(); }
    }

    updateSelUI();

    function updateSelUI() {
        const bar = document.getElementById('selBar');
        const dlBtn = document.getElementById('dlAllBtn');
        const count = document.getElementById('selCount');
        const has = selected.size > 0;
        bar.classList.toggle('on', has);
        dlBtn.style.display = has ? '' : 'none';
        count.textContent = `${selected.size} selected`;
    }

    function setView(v) {
        currentView = v;
        document.getElementById('gridView').classList.toggle('on', v === 'grid');
        document.getElementById('listView').classList.toggle('on', v === 'list');
        document.getElementById('gridBtn').classList.toggle('active', v === 'grid');
        document.getElementById('listBtn').classList.toggle('active', v === 'list');
    }

    // Modal Manager: Handles media parsing overrides inside an immersive blur overlay panel
    function openOverlay(idx) {
        ovIndex = idx;
        const f = filtered[idx];
        if (!f) return;

        document.getElementById('ovTitle').textContent = f.name;
        document.getElementById('ovMeta').innerHTML = `${fmtSize(f.size)} &bull; ${fmtDate(f.lastModified)}`;

        document.getElementById('ovDl').onclick = () => triggerDownload(f);
        document.getElementById('ovPrev').disabled = idx <= 0;
        document.getElementById('ovNext').disabled = idx >= filtered.length - 1;

        const body = document.getElementById('ovBody');
        const sw   = document.getElementById('ovStreamWrap');
        const g    = mimeGroup(f.mimeType);

        sw.style.display = 'none'; body.innerHTML = '';

        // Dynamic routing template injectors based on MIME classification maps
        if (g === 'image') {
            body.innerHTML = `<img src="${fileUrl(f.id)}" alt="${esc(f.name)}" onerror="this.parentElement.innerHTML='${noPreviewHtml()}'">`;
        } else if (g === 'video') {
            body.innerHTML = `<video controls autoplay preload="metadata"><source src="${fileUrl(f.id)}" type="${f.mimeType}"></video>`;
            sw.style.display = ''; document.getElementById('ovStream').onclick = () => window.open(fileUrl(f.id), '_blank');
        } else if (g === 'audio') {
            body.innerHTML = `<audio controls autoplay><source src="${fileUrl(f.id)}" type="${f.mimeType}"></audio>`;
            sw.style.display = ''; document.getElementById('ovStream').onclick = () => window.open(fileUrl(f.id), '_blank');
        } else if (g === 'pdf') {
            body.innerHTML = `<iframe src="${fileUrl(f.id)}#toolbar=1" title="${esc(f.name)}"></iframe>`;
        } else {
            body.innerHTML = `
                <div class="no-preview">
                    ${mimeIconSvg(f.mimeType, 56)}
                    <p>Format preview unsupported natively</p>
                    <button class="btn btn-primary btn-sm" onclick="triggerDownload(filtered[${idx}])">${dlIconSvg(12)} Download binary</button>
                </div>`;
        }

        document.getElementById('overlay').classList.add('on');
        document.body.style.overflow = 'hidden';
    }

    function noPreviewHtml() {
        return `<div class='no-preview'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.5'><path d='M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z'/><polyline points='13 2 13 9 20 9'/></svg><p>Preview initialization failed</p></div>`;
    }

    function ovClose(e) {
        if (e && e.target !== document.getElementById('overlay')) return;
        document.getElementById('overlay').classList.remove('on');
        document.body.style.overflow = '';
        // Releases active hardware processing scopes by flushing structural media tracks completely on view close
        document.getElementById('ovBody').querySelectorAll('video,audio').forEach(m => { m.pause(); m.src = ''; });
    }

    function ovNavigate(dir) {
        const next = ovIndex + dir;
        if (next < 0 || next >= filtered.length) return;
        document.getElementById('ovBody').querySelectorAll('video,audio').forEach(m => { m.pause(); m.src = ''; });
        openOverlay(next);
    }

    // Streams bytes incrementally through fetch pipelines to construct a fluid local percentage download indicator UI
    async function triggerDownload(f) {
        const strip   = document.getElementById('dlStrip');
        const nameEl  = document.getElementById('dlName');
        const fillEl  = document.getElementById('dlFill');
        const pctEl   = document.getElementById('dlPct');

        nameEl.textContent = f.name; fillEl.style.width = '0%'; pctEl.textContent = '0%';
        strip.classList.add('on');

        try {
            const res = await fetch(fileUrl(f.id));
            if (!res.ok) throw new Error('Network execution boundary drop');

            const total  = parseInt(res.headers.get('content-length') || '0');
            const reader = res.body.getReader(); // Hooks into the incoming stream reader thread
            const chunks = [];
            let received = 0;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                received += value.length;
                if (total > 0) {
                    const pct = Math.round(received / total * 100);
                    fillEl.style.width = pct + '%'; pctEl.textContent = pct + '%';
                }
            }

            fillEl.style.width = '100%'; pctEl.textContent = '100%';
            const blob = new Blob(chunks);
            const url  = URL.createObjectURL(blob);
            // Creates an abstract anchor node component element to invoke native system file download frames cleanly
            const a    = Object.assign(document.createElement('a'), { href: url, download: f.name });
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
        } catch (err) {
            toast('Download link transmission failure');
        } finally {
            setTimeout(() => strip.classList.remove('on'), 1000);
        }
    }

    // Batched Sequential Multi-part Download Scheduler Pipeline
    async function downloadSelected() {
        const toGet = [...selected].map(id => allFiles.find(f => f.id === id)).filter(Boolean);
        if (!toGet.length) return;
        toast(`Staging multi-part pipeline arrays…`);
        for (let i = 0; i < toGet.length; i++) {
            // Injects a deliberate 400ms thread window delay spacing barrier to keep browser threads from choking on multiple file writes
            if (i > 0) await new Promise(r => setTimeout(r, 400));
            await triggerDownload(toGet[i]);
        }
    }

    // Global Hardware Key Bindings Listener Matrix
    document.addEventListener('keydown', e => {
        const ov = document.getElementById('overlay');
        if (ov.classList.contains('on')) {
            if (e.key === 'Escape') ovClose({ target: ov });
            if (e.key === 'ArrowLeft')  ovNavigate(-1);
            if (e.key === 'ArrowRight') ovNavigate(1);
        }
        // Universal Shortcut Mapping: Ctrl+A / Cmd+A captures all matching items inside the current filter block
        if ((e.ctrlKey || e.metaKey) && e.key === 'a' && !ov.classList.contains('on')) {
            e.preventDefault(); filtered.forEach(f => selected.add(f.id));
            updateSelUI(); renderGrid(); renderList();
        }
    });

    function toast(msg) {
        const wrap = document.getElementById('toastWrap');
        const el   = Object.assign(document.createElement('div'), { className: 'toast', textContent: msg });
        wrap.appendChild(el); setTimeout(() => el.remove(), 2800);
    }

    function mimeGroup(m) {
        if (!m) return 'other';
        if (m.startsWith('image/'))  return 'image';
        if (m.startsWith('video/'))  return 'video';
        if (m.startsWith('audio/'))  return 'audio';
        if (m === 'application/pdf') return 'pdf';
        if (m.includes('zip') || m.includes('archive')) return 'zip';
        return 'other';
    }

    const groupColor = { image:'--green', video:'--pink', audio:'--purple', pdf:'--red', zip:'--orange', other:'--slate' };

    function mimeIconSvg(mime, size = 20) {
        const g = mimeGroup(mime); const col = `var(${groupColor[g] || groupColor.other})`; const s = size;
        const icons = {
            image: `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`,
            video: `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>`,
            audio: `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`,
            pdf:   `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>`,
            zip:   `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/><line x1="12" y1="11" x2="12" y2="17"/><polyline points="9 14 12 17 15 14"/></svg>`,
            other: `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`
        };
        return icons[g] || icons.other;
    }

    function mimeColorAlpha(mime) {
        const map = { image:'rgba(76,175,80,.08)', video:'rgba(233,30,99,.08)', audio:'rgba(156,39,176,.08)', pdf:'rgba(217,48,37,.08)', zip:'rgba(255,152,0,.08)', other:'rgba(96,125,139,.08)' };
        return map[mimeGroup(mime)] || map.other;
    }

    // Structural Vector Asset Components
    function checkSvg(size = 10) { return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><polyline points="20 6 9 17 4 12"/></svg>`; }
    function dlIconSvg(s = 14) { return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`; }

    function fmtSize(b) {
        if (b < 1024) return `${b} B`;
        if (b < 1048576) return `${(b/1024).toFixed(1)} KB`;
        if (b < 1073741824) return `${(b/1048576).toFixed(1)} MB`;
        return `${(b/1073741824).toFixed(2)} GB`;
    }

    function fmtDate(ts) {
        if (!ts) return '—';
        return new Date(ts).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
    }

    // Safety Escape Sanitizer: Prevents structural Cross-Site Scripting (XSS) injection injection vulnerabilities
    // inside the browser client if a shared file metadata layout includes rogue HTML layout payload characters
    function esc(s) {
        return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    init();
</script>
</body>
</html>
