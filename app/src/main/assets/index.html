<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dropX | Receiver</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: white; padding: 2rem; }
        .card { background: #1e293b; padding: 1rem; border-radius: 12px; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
        .btn { background: #3b82f6; color: white; padding: 0.5rem 1rem; border-radius: 6px; text-decoration: none; font-weight: 600; }
        .size { color: #94a3b8; font-size: 0.8rem; }
    </style>
</head>
<body>
<h1>dropX Gallery</h1>
<div id="fileList">Loading files...</div>

<script>
    async function fetchFiles() {
        const container = document.getElementById('fileList');
        try {
            const res = await fetch('/api/files');
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const files = await res.json();

            if (files.length === 0) {
                container.innerHTML = '<div class="card">No files selected on phone.</div>';
                return;
            }

            container.innerHTML = files.map(f => `
                <div class="card">
                    <div>
                        <div>${f.name}</div>
                        <div class="size">${(f.size / (1024*1024)).toFixed(2)} MB</div>
                    </div>
                    <a href="/download/${f.id}" class="btn">Download</a>
                </div>
            `).join('');
        } catch (e) {
            container.innerHTML = `<div class="card" style="color:#f87171">Connection Error: ${e.message}</div>`;
        }
    }
    fetchFiles();
    // Refresh the list every 5 seconds in case more files are added
    setInterval(fetchFiles, 5000);
</script>
</body>
</html>
